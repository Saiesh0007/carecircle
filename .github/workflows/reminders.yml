# Free scheduler for serverless hosting: calls the protected reminder endpoint every 10 minutes.
# Requires repository secrets APP_URL (e.g. https://carecircle-ochre.vercel.app) and CRON_SECRET.
name: Reminder tick
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger due reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not configured; skipping."; exit 0; fi
          curl -fsS -X POST "$APP_URL/internal/reminders/tick" -H "Authorization: Bearer $CRON_SECRET" --max-time 60
